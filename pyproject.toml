[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cca-cli"
# Canonical CCA release version; runtime code reads this from package metadata.
version = "0.3.2"
description = "CCA — A Python native code agent CLI with pluggable LLM backends."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Tom Goldstein" },
    { name = "Jeffrey Yang Fan Chiang" },
]
maintainers = [
    { name = "Jeffrey Yang Fan Chiang" },
]
keywords = [
    "ai-agent",
    "cli",
    "coding-agent",
    "developer-tools",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "anthropic>=0.120.0",
    "openai>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "click>=8.1.0",
    "markdownify>=0.11.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "nbformat>=5.9.0",
    "ddgs>=9.0.0",
    "pypdf>=6.21.4",
    "Pillow>=13.0.0",
    "pathspec>=0.12.0",
    # mcp 2 renamed the client transports CCA uses; 1.30.0 carries the session-expiry fix.
    "mcp>=1.30.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
observability = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[project.urls]
Homepage = "https://cca-sh.github.io/CCA/"
Documentation = "https://cca-sh.github.io/CCA/"
Source = "https://github.com/CCA-sh/CCA"
Issues = "https://github.com/CCA-sh/CCA/issues"
Changelog = "https://github.com/CCA-sh/CCA/blob/main/CHANGELOG.md"

[project.scripts]
cca = "cca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cca"]

# Allowlist: internal docs and other working files must never ship in the sdist
[tool.hatch.build.targets.sdist]
only-include = [
    "src/cca",
    "tests",
    "docs/public",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
