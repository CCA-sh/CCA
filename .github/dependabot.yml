version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # mcp 2 renamed the client transports CCA uses; port before lifting the <2 cap.
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
